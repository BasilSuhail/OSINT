<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="840" height="480" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a1a1a">A coin flip in all three pre-registered evaluations</text>
  <text x="40" y="64" font-size="13" fill="#555">AUROC of the composite stress index vs the 0.50 coin-flip line and the 0.55 declared threshold. Higher = better.</text>

  <!-- plot: x 100..780, y 410 - v*320 (AUROC 0..1) -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="100" y1="410" x2="780" y2="410"/>
    <line x1="100" y1="330" x2="780" y2="330"/>
    <line x1="100" y1="170" x2="780" y2="170"/>
    <line x1="100" y1="90"  x2="780" y2="90"/>
  </g>
  <g font-size="12" fill="#777" text-anchor="end">
    <text x="90" y="414">0.00</text>
    <text x="90" y="334">0.25</text>
    <text x="90" y="254">0.50</text>
    <text x="90" y="174">0.75</text>
    <text x="90" y="94">1.00</text>
  </g>
  <text x="34" y="250" font-size="13" fill="#555" transform="rotate(-90 34 250)" text-anchor="middle">AUROC</text>

  <!-- top-right key (empty region, no bars here) -->
  <line x1="470" y1="115" x2="500" y2="115" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="508" y="119" font-size="12.5" fill="#d97706">0.55 declared threshold</text>
  <line x1="470" y1="140" x2="500" y2="140" stroke="#111" stroke-width="2"/>
  <text x="508" y="144" font-size="12.5" fill="#111" font-weight="600">0.50 coin flip</text>

  <!-- reference lines -->
  <line x1="100" y1="234" x2="780" y2="234" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="100" y1="250" x2="780" y2="250" stroke="#111" stroke-width="2"/>

  <!-- bars: composite AUROC -->
  <g fill="#2563eb">
    <rect x="170" y="249.4" width="110" height="160.6"/>
    <rect x="390" y="246.5" width="110" height="163.5"/>
    <rect x="610" y="240.1" width="110" height="169.9"/>
  </g>
  <g font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <text x="225" y="243">0.502</text>
    <text x="445" y="240">0.511</text>
    <text x="665" y="233">0.531</text>
  </g>
  <g font-size="14" fill="#1a1a1a" text-anchor="middle">
    <text x="225" y="432" font-weight="600">Pooled</text>
    <text x="445" y="432" font-weight="600">Onset</text>
    <text x="665" y="432" font-weight="600">Within-country</text>
  </g>
  <g font-size="11.5" fill="#777" text-anchor="middle">
    <text x="225" y="450">base rate 0.929</text>
    <text x="445" y="450">base rate 0.744</text>
    <text x="665" y="450">base rate 0.300</text>
  </g>

  <text x="40" y="474" font-size="11.5" fill="#999">The pooled 0.93 was the base rate (telling Norway from Syria), not skill; within country it collapses to 0.30 (#380, #582).</text>
</svg>
