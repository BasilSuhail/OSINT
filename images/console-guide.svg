<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="1144" viewBox="0 0 2000 1144" role="img" aria-labelledby="title desc">
  <title id="title">Numbered guide to the OSINT World Monitor console</title>
  <desc id="desc">The live console with nineteen numbered callouts: the omnibox that both searches and asks, the system monitor pill, the news-feed control, developing and contested stories, the headline ticker, data quality, the deck pager, the panel handles, country shading, clusters, hazard markers, the map row budget, the source-family toggles and counts, the overlays, the severity range and reset, playback, the scrubber collapse handle, and the time window.</desc>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <style>
      /* No filter here on purpose: a perfectly horizontal or vertical path has
         a zero-area bounding box, so a filter region derived from it renders
         nothing and the leader line silently disappears. */
      .line { fill: none; stroke: #fff0a6; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #f4c84a; stroke: #111827; stroke-width: 5; filter: url(#shadow); }
      .num { fill: #111827; font: 700 29px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
      .target { fill: #f4c84a; stroke: #111827; stroke-width: 3; }
    </style>
  </defs>
  <image x="0" y="0" width="2000" height="1144" xlink:href="console-screenshot-live.jpg"/>

  <!-- 1-2 · the two things that span the whole top: the omnibox, and system health -->
  <path class="line" d="M760 52 L658 47"/><circle class="target" cx="658" cy="47" r="8"/><circle class="dot" cx="760" cy="52" r="28"/><text class="num" x="760" y="52">1</text>
  <path class="line" d="M1560 130 L1788 39"/><circle class="target" cx="1788" cy="39" r="8"/><circle class="dot" cx="1560" cy="130" r="28"/><text class="num" x="1560" y="130">2</text>

  <!-- 3-8 · the card deck: reading page, story lists, ticker, data quality, pager -->
  <path class="line" d="M760 140 L516 110"/><circle class="target" cx="516" cy="110" r="8"/><circle class="dot" cx="760" cy="140" r="28"/><text class="num" x="760" y="140">3</text>
  <path class="line" d="M760 230 L482 213"/><circle class="target" cx="482" cy="213" r="8"/><circle class="dot" cx="760" cy="230" r="28"/><text class="num" x="760" y="230">4</text>
  <path class="line" d="M760 480 L578 470"/><circle class="target" cx="578" cy="470" r="8"/><circle class="dot" cx="760" cy="480" r="28"/><text class="num" x="760" y="480">5</text>
  <path class="line" d="M760 600 L566 566"/><circle class="target" cx="566" cy="566" r="8"/><circle class="dot" cx="760" cy="600" r="28"/><text class="num" x="760" y="600">6</text>
  <path class="line" d="M760 960 L628 1043"/><circle class="target" cx="628" cy="1043" r="8"/><circle class="dot" cx="760" cy="960" r="28"/><text class="num" x="760" y="960">7</text>
  <path class="line" d="M500 1108 L344 1107"/><circle class="target" cx="344" cy="1107" r="8"/><circle class="dot" cx="500" cy="1108" r="28"/><text class="num" x="500" y="1108">8</text>

  <!-- 9-12 · the panel handles, and the three things drawn on the map itself -->
  <path class="line" d="M820 540 L686 573"/><circle class="target" cx="686" cy="573" r="8"/><circle class="dot" cx="820" cy="540" r="28"/><text class="num" x="820" y="540">9</text>
  <path class="line" d="M1200 240 L1300 300"/><circle class="target" cx="1300" cy="300" r="8"/><circle class="dot" cx="1200" cy="240" r="28"/><text class="num" x="1200" y="240">10</text>
  <path class="line" d="M900 330 L1010 393"/><circle class="target" cx="1010" cy="393" r="8"/><circle class="dot" cx="900" cy="330" r="28"/><text class="num" x="900" y="330">11</text>
  <path class="line" d="M830 862 L946 788"/><circle class="target" cx="946" cy="788" r="8"/><circle class="dot" cx="830" cy="862" r="28"/><text class="num" x="830" y="862">12</text>

  <!-- 13-16 · right rail: row budget, family toggles, overlays, severity + reset -->
  <path class="line" d="M1560 190 L1702 104"/><circle class="target" cx="1702" cy="104" r="8"/><circle class="dot" cx="1560" cy="190" r="28"/><text class="num" x="1560" y="190">13</text>
  <path class="line" d="M1490 320 L1662 262"/><circle class="target" cx="1662" cy="262" r="8"/><circle class="dot" cx="1490" cy="320" r="28"/><text class="num" x="1490" y="320">14</text>
  <path class="line" d="M1500 900 L1666 915"/><circle class="target" cx="1666" cy="915" r="8"/><circle class="dot" cx="1500" cy="900" r="28"/><text class="num" x="1500" y="900">15</text>
  <path class="line" d="M1500 1010 L1790 1075"/><circle class="target" cx="1790" cy="1075" r="8"/><circle class="dot" cx="1500" cy="1010" r="28"/><text class="num" x="1500" y="1010">16</text>

  <!-- 17-19 · the bottom strip: playback, collapse handle, time window -->
  <path class="line" d="M790 1020 L714 1096"/><circle class="target" cx="714" cy="1096" r="8"/><circle class="dot" cx="790" cy="1020" r="28"/><text class="num" x="790" y="1020">17</text>
  <path class="line" d="M1108 980 L1108 1044"/><circle class="target" cx="1108" cy="1044" r="8"/><circle class="dot" cx="1108" cy="980" r="28"/><text class="num" x="1108" y="980">18</text>
  <path class="line" d="M1330 1010 L1302 1090"/><circle class="target" cx="1302" cy="1090" r="8"/><circle class="dot" cx="1330" cy="1010" r="28"/><text class="num" x="1330" y="1010">19</text>
</svg>
